<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diego Custódio | Designer e Artista Visual</title>
<meta name="description" content="Portfólio de Diego Custódio, designer e artista visual em São Paulo.">
<style>
:root{
  --m:'Space Mono',ui-monospace,Menlo,monospace;--s:'DM Sans','Helvetica Neue',Arial,sans-serif;
  --fs:14px;--bg:#fff;--tx:#000;--dk:#000;--tdk:#fff;--foco:#1633FF;
  --y:#FFC400;--b:#1633FF;--r:#E4002B;--vazio:#1c1c1c;--retr:#222;
  --mw:1200px;--tw:1100px;--off:150px;--gap:70px;--gc:4;--gcm:2;--gg:16px;--pw:300px;--tlh:230px;
  --blobdur:16s;--ease:cubic-bezier(.22,1,.36,1);
}
@property --c{syntax:'<color>';inherits:true;initial-value:#E000C8}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font:400 var(--fs)/1.6 var(--m);background:var(--bg);color:var(--tx);overflow-x:hidden}
a{color:inherit}
img{display:block}
:focus-visible{outline:3px solid var(--foco);outline-offset:3px}
em{font-style:italic}
.slot{position:relative;display:grid;place-items:center;text-align:center;padding:12px;font:400 11px/1.4 var(--m);color:rgba(255,255,255,.7);overflow:hidden}
.im{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.04);transition:opacity .9s var(--ease),transform 1.4s var(--ease)}
.im.ok{opacity:1;transform:scale(1)}
.rv{opacity:0;translate:0 38px;transition:opacity var(--du,1s) var(--ease),translate calc(var(--du,1s)*1.2) var(--ease),scale var(--du,1s) var(--ease);transition-delay:var(--d,0s)}
.rv.in{opacity:1;translate:0 0;scale:1}

nav{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:clamp(14px,2vw,22px) clamp(16px,2.5vw,34px);color:#fff;mix-blend-mode:difference;pointer-events:none;transition:translate .6s var(--ease)}
nav.off{translate:0 -130%}
nav>*{pointer-events:auto}
.logo{width:30px;height:30px;border-radius:50%;background:#fff;display:grid;place-items:center;transition:scale .5s var(--ease)}
.logo:hover{scale:1.18}
.logo::before{content:"";width:9px;height:9px;border:solid #000;border-width:2.5px 0 0 2.5px;transform:translateY(2px) rotate(45deg)}
nav div{display:flex;gap:clamp(14px,2vw,26px)}
nav div a{font-weight:700;font-size:15px;text-decoration:none;border-bottom:1.5px solid #fff;padding-bottom:1px;transition:translate .4s var(--ease),letter-spacing .4s var(--ease)}
nav div a:hover{translate:0 -2px;letter-spacing:.04em}

#inicio{min-height:100vh;min-height:100svh;display:grid;grid-template-columns:1fr 1fr;align-items:center;padding:clamp(90px,10vw,110px) 6vw 60px;gap:2vw}
#inicio.solo{grid-template-columns:1fr}
.blob{justify-self:center;width:min(34vw,430px);aspect-ratio:1;border-radius:50%;filter:blur(16px);
  background:radial-gradient(circle,var(--c) 0 36%,transparent 70%);
  animation:pop 1.8s var(--ease) both,hue var(--blobdur) linear infinite;will-change:transform,translate}
.noanim .blob{animation:hue var(--blobdur) linear infinite}
@keyframes pop{from{scale:.55;opacity:0}to{scale:1;opacity:1}}
#inicio h1{font:700 clamp(22px,2.9vw,40px)/1.18 var(--m);text-transform:uppercase;letter-spacing:-.01em;max-width:620px}
#inicio h1 em{font-weight:400}
#inicio{grid-template-columns:1fr;place-items:center}
#inicio .blob{grid-area:1/1;width:min(42vw,540px)}
#inicio h1{grid-area:1/1;text-align:center;position:relative;z-index:1;justify-self:center}
@media(max-width:860px){#inicio .blob{width:78vw}}

.mq{overflow:hidden;white-space:nowrap;padding:12px 0;font:italic 700 14px var(--m);letter-spacing:.2em}
.mq div{display:inline-block;white-space:pre;will-change:transform}

#trabalhos{padding:clamp(48px,7vw,70px) 5vw clamp(70px,9vw,110px)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:4vw;max-width:var(--tw);margin:0 auto}
.cols>div{display:flex;flex-direction:column;gap:var(--gap);will-change:transform}
.cols>div+div{margin-top:var(--off)}
.work{display:block;text-decoration:none;position:relative}
.work .slot{width:100%;background:var(--vazio);transition:filter .6s var(--ease)}
.work .t{font:500 14px var(--s);margin-top:10px;transition:translate .5s var(--ease)}
.work .c{font:400 11px var(--m);color:#aaa}
.work:hover .slot{filter:brightness(1.12)}
.work:hover .im.ok{transform:scale(1.05)}
.work:hover .t{translate:6px 0}
.drag{position:absolute;cursor:grab;touch-action:none;user-select:none;z-index:3;transition:rotate .6s var(--ease),scale .4s var(--ease)}
.drag.lift{cursor:grabbing;scale:1.12;filter:drop-shadow(0 10px 10px rgba(0,0,0,.4))}
.drag.pic{background:center/contain no-repeat}
.smile{--u:calc(var(--sz,46px)/46);border-radius:50%;background:#fff}
.smile::before{content:"";position:absolute;left:calc(13px*var(--u));top:calc(15px*var(--u));width:calc(4px*var(--u));height:calc(8px*var(--u));border-radius:50%;background:#000;box-shadow:calc(16px*var(--u)) 0 #000}
.smile::after{content:"";position:absolute;left:calc(12px*var(--u));top:calc(25px*var(--u));width:calc(22px*var(--u));height:calc(9px*var(--u));border-bottom:calc(3px*var(--u)) solid #000;border-radius:0 0 calc(22px*var(--u)) calc(22px*var(--u))}

#galeria{padding:clamp(60px,8vw,90px) 5vw 60px}
.wide{display:flex;flex-wrap:wrap;justify-content:space-between;gap:0 10px;font:italic 700 clamp(26px,5.6vw,76px)/1 var(--m);text-transform:uppercase;max-width:var(--mw);margin:0 auto 46px}
.gal{columns:var(--gc);column-gap:var(--gg);max-width:var(--mw);margin:0 auto}
.gal .slot{margin-bottom:var(--gg);break-inside:avoid;width:100%}
.gal .slot:hover .im.ok{transform:scale(1.06)}

.proj{position:relative;max-width:var(--mw);margin:70px auto 0;padding:0 60px}
.lab{position:absolute;top:50%;writing-mode:vertical-rl;border:1.5px solid currentColor;border-radius:999px;padding:18px 7px;font:400 11px var(--m);background:var(--bg);white-space:nowrap;z-index:2}
.lab.l{left:6px;transform:translateY(-50%) rotate(180deg)}
.lab.r{right:6px;transform:translateY(-50%)}
.tiles{display:grid;grid-template-columns:repeat(var(--tc),1fr);gap:0}
.tiles .slot{aspect-ratio:5/8;padding:0}
.posters{--pw2:clamp(90px,12vw,150px);--ov:.42;--ry:-55deg;display:flex;padding:40px 0 60px;perspective:1400px;overflow:hidden}
.posters .slot{flex:0 0 var(--pw2);aspect-ratio:3/4.4;margin-right:calc(var(--pw2)*var(--ov)*-1);
  transform:rotateY(var(--ry));transform-origin:left center;padding:0}

#sobre{padding:clamp(70px,9vw,110px) 5vw clamp(80px,10vw,120px)}
.about{display:grid;grid-template-columns:minmax(220px,var(--pw)) 1fr;gap:5vw;max-width:var(--mw);margin:0 auto}
.about h2{font:700 clamp(24px,3vw,38px)/1.12 var(--m);margin-bottom:30px}
.about h2 em{font-weight:400}
.photo{width:100%;aspect-ratio:3/4;background:var(--retr)}
.tlw{container-type:inline-size}
.about .txt{font-size:13px;max-width:560px;margin-bottom:34px}
.tl{position:relative;display:grid;grid-template-columns:repeat(var(--n,7),1fr);height:var(--tlh);margin-bottom:34px}
.tl::before{content:"";position:absolute;left:0;right:0;top:calc(var(--tlh)/2);border-top:1.5px solid currentColor}
.tp{position:relative;font-size:11px;line-height:1.35;padding-right:8px}
.tp::before{content:"";position:absolute;left:0;top:calc(var(--tlh)/2 - 4px);width:8px;height:8px;border-radius:50%;background:currentColor;transition:scale .4s var(--ease)}
.tp:hover::before{scale:1.8}
.tp>div{position:absolute;left:0;right:0}
.tp.up>div{bottom:calc(var(--tlh)/2 + 13px)}
.tp.dn>div{top:calc(var(--tlh)/2 + 15px)}
.tp em{display:block;font-size:9px;margin-bottom:2px}
.tp b{display:block}
.sk{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sk strong{font:italic 700 17px var(--m);margin-right:8px}
.sk span,.sk a{border:1.5px solid currentColor;border-radius:999px;padding:6px 18px;font-weight:700;font-size:12px;text-decoration:none;transition:background .35s var(--ease),color .35s var(--ease),translate .35s var(--ease)}
.sk span:hover{translate:0 -3px}
.sk a{background:var(--tdk);color:var(--dk);border-color:var(--tdk)}
.sk a:hover{background:var(--y);border-color:var(--y);translate:0 -3px}
@container (max-width:720px){
  .tl{display:block;height:auto;border-left:1.5px solid currentColor;margin-left:4px}
  .tl::before,.tp::before{display:none}
  .tp{padding:0 0 16px 16px}.tp>div{position:static}
}

#contato{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));background:#000}
#contato>div{padding:clamp(32px,4vw,48px) clamp(24px,3vw,40px) clamp(44px,5vw,70px);min-height:230px}
#contato h3{font:italic 700 22px var(--m);margin-bottom:12px}

.book{position:relative;margin:0 auto;width:min(100%,var(--W,900px));perspective:2600px;touch-action:pan-y;user-select:none;cursor:grab}
.spread{position:absolute;inset:0;transform-style:preserve-3d;transition:transform var(--sp,.9s) var(--ease)}
.lf{position:absolute;top:0;left:50%;width:50%;height:100%;transform-origin:left center;transform-style:preserve-3d;transition:transform var(--sp,.9s) cubic-bezier(.45,.05,.25,1)}
.fr,.bkf{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,var(--sb,.3))}

/* ===== Base visual: Komnata x Diego (painéis arredondados, tiles, cores vibrantes) ===== */
:root{--rd:clamp(22px,3vw,38px);--g:#ECECEF;--p1:#FF3EA5;--p2:#FFC400;--p3:#1633FF;--p4:#1FD07A;--p5:#FF7A1A;--p6:#7A3CFF;--cta:linear-gradient(100deg,#FF3EA5,#FF7A1A 55%,#FFC400)}
body{background:var(--g)!important}
#app{padding:0 clamp(8px,1.1vw,14px) clamp(8px,1.1vw,14px)}
#app>section,#app>footer{border-radius:var(--rd);overflow:clip;margin-top:clamp(8px,1.1vw,14px)}
#inicio,#galeria{background:#fff}
.mq{margin:clamp(8px,1.1vw,14px) 0;border-radius:99px;padding:14px 0}
nav{mix-blend-mode:normal!important;left:clamp(8px,1.1vw,14px);right:clamp(8px,1.1vw,14px);top:clamp(8px,1.1vw,14px);padding:8px 10px 8px 12px;border-radius:99px;background:rgba(236,236,239,.78);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);color:#111;box-shadow:0 6px 30px rgba(0,0,0,.08)}

nav div{gap:4px;align-items:center}
nav div a{border:0;padding:8px 15px;border-radius:99px;font:600 13px var(--s);transition:background .3s,color .3s,translate .4s var(--ease)}
nav div a:hover{background:#111;color:#fff;letter-spacing:0;translate:0 0}
nav div a:last-child{background:var(--cta);color:#fff}
.bh>span{font:800 clamp(36px,6.6vw,96px)/.9 var(--s);letter-spacing:-.045em;text-transform:uppercase}
.bh>span em,.about h2 em{font-style:normal;background:var(--cta);-webkit-background-clip:text;background-clip:text;color:transparent}
.bh>p{font:500 13px/1.45 var(--s)}
.wide{font:800 clamp(30px,6vw,86px)/.92 var(--s);letter-spacing:-.04em}
.gal .slot,.photo{border-radius:20px}
.chip{position:absolute;left:18px;top:16px;z-index:120;background:var(--p1);color:#000;font:700 10px var(--m);letter-spacing:.08em;text-transform:uppercase;padding:6px 12px;border-radius:99px;font-style:normal}
.ed .chip{background:var(--p4)}
.stage,.bkw{border-radius:var(--rd)}
.fcv .slot,.kid .slot{border-radius:var(--rd)}
.fcv::after{content:"";position:absolute;inset:0;border-radius:var(--rd);background:linear-gradient(transparent 45%,rgba(0,0,0,.55));pointer-events:none;z-index:2}
.fcv::before{content:"+";position:absolute;right:clamp(12px,1.4vw,20px);bottom:clamp(12px,1.4vw,20px);z-index:3;width:34px;height:34px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;font:700 18px var(--s);transition:rotate .6s var(--ease)}
.fld.on .fcv::before{rotate:90deg}
.fld .t{position:absolute;left:clamp(14px,1.6vw,24px);right:56px;bottom:clamp(12px,1.4vw,22px);margin:0;z-index:3;color:#fff;font:800 clamp(16px,2vw,30px)/1 var(--s);letter-spacing:-.03em;text-shadow:0 2px 20px rgba(0,0,0,.45)}
.fld .c{position:absolute;left:clamp(14px,1.6vw,24px);top:clamp(12px,1.4vw,20px);z-index:3;background:var(--p2);color:#000;padding:5px 12px;border-radius:99px;font:700 10px var(--m);letter-spacing:.08em;text-transform:uppercase}
.fld:nth-child(1) .c{background:var(--p1)}.fld:nth-child(2) .c{background:var(--p4)}
#inicio{position:relative}
.hc{position:absolute;z-index:2;display:flex;align-items:center;gap:10px;padding:12px 14px 12px 20px;border-radius:20px;background:var(--hc,#fff);color:#111;font:700 clamp(12px,1.2vw,16px) var(--s);text-decoration:none;box-shadow:0 14px 40px rgba(0,0,0,.18);rotate:var(--r0,0deg);translate:calc(var(--mx,0)*var(--px,14px)) calc(var(--my,0)*var(--px,14px));animation:hcIn .9s var(--ease) both;animation-delay:calc(.4s + var(--i,0)*.12s);transition:rotate .5s var(--ease),scale .4s var(--ease),box-shadow .4s}
.hc i{width:26px;height:26px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;font-style:normal;transition:rotate .5s var(--ease)}
.hc:hover{scale:1.08;rotate:0deg;box-shadow:0 24px 60px rgba(0,0,0,.28)}.hc:hover i{rotate:90deg}
@keyframes hcIn{from{opacity:0;scale:.6}to{opacity:1;scale:1}}
#inicio .hc:nth-of-type(1){left:7%;top:24%;--r0:-8deg}
#inicio .hc:nth-of-type(2){right:8%;top:20%;--r0:6deg;--px:-18px}
#inicio .hc:nth-of-type(3){left:12%;bottom:20%;--r0:5deg;--px:20px}
#inicio .hc:nth-of-type(4){right:11%;bottom:22%;--r0:-6deg}
#inicio .hc:nth-of-type(n+5){left:calc(20% + var(--i)*8%);top:72%}
@media(max-width:700px){.hc{display:none}}
.about{grid-template-columns:minmax(200px,calc(var(--pw)*.9)) 1fr;gap:clamp(24px,4vw,64px);align-items:start}
.about>div:first-child{position:sticky;top:90px;align-self:start}
.cap{margin-bottom:16px}.cap span{display:inline-block;background:var(--p2);color:#000;font:700 11px var(--m);letter-spacing:.08em;text-transform:uppercase;padding:6px 14px;border-radius:99px}
.photo{overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35);rotate:-2deg;transition:rotate .6s var(--ease)}.photo:hover{rotate:0deg}
.about h2{font:800 clamp(36px,5.6vw,84px)/.92 var(--s);letter-spacing:-.045em;text-transform:uppercase;margin-bottom:clamp(20px,3vw,40px)}
.about .txt{font:500 clamp(18px,2.3vw,32px)/1.25 var(--s);letter-spacing:-.02em;max-width:none;margin-bottom:clamp(24px,3vw,44px)}
.about .txt em{font-style:normal;font-weight:800}
.about .txt em:nth-of-type(4n+1){color:var(--p1)}.about .txt em:nth-of-type(4n+2){color:var(--p2)}.about .txt em:nth-of-type(4n+3){color:var(--p4)}.about .txt em:nth-of-type(4n){color:#6B8BFF}
.nms{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:clamp(30px,4vw,56px)}
.nm{border-radius:22px;padding:clamp(14px,1.6vw,22px);min-height:clamp(120px,13vw,190px);display:flex;flex-direction:column;justify-content:space-between;background:var(--nc,var(--p2));color:#111;transition:translate .5s var(--ease),rotate .5s var(--ease)}
.nm:nth-child(1){--nc:var(--p1)}.nm:nth-child(2){--nc:var(--p2)}.nm:nth-child(3){--nc:var(--p4)}.nm:nth-child(4){--nc:var(--p3);color:#fff}
.nm b{font:800 clamp(36px,5vw,76px)/.9 var(--s);letter-spacing:-.05em}
.nm span{font:600 clamp(10px,.95vw,13px)/1.3 var(--s)}
.nm:hover{translate:0 -8px;rotate:-1.5deg}
@media(max-width:900px){.nms{grid-template-columns:repeat(2,1fr)}.about{grid-template-columns:1fr}.about>div:first-child{position:static}}
.tp::before{background:var(--p1)}.tp:nth-child(4n+2)::before{background:var(--p2)}.tp:nth-child(4n+3)::before{background:var(--p4)}.tp:nth-child(4n)::before{background:#6B8BFF}
.sw{gap:10px;margin-bottom:clamp(20px,3vw,36px)}
.sw strong,.sk strong{flex:0 0 100%;font:800 clamp(18px,2vw,26px) var(--s);letter-spacing:-.03em;font-style:normal;margin:0 0 6px}
.sw .it{background:#ECECEF;color:#111;border-radius:20px;padding:12px 18px 12px 12px;gap:12px;transition:translate .45s var(--ease),rotate .45s var(--ease),background .3s}
.sw .it:hover{translate:0 -8px;rotate:-2deg;background:#fff}
.ic2{border-radius:12px;width:44px;height:44px}
.sw .it span{font:700 13px var(--s)}
.sk span{background:var(--pc,#fff);color:#111;border:0;padding:8px 18px;font:700 13px var(--s)}
.sk span:nth-of-type(5n+1){--pc:var(--p1)}.sk span:nth-of-type(5n+2){--pc:var(--p2)}.sk span:nth-of-type(5n+3){--pc:var(--p4)}.sk span:nth-of-type(5n+4){--pc:#8FA6FF}.sk span:nth-of-type(5n){--pc:var(--p5)}
@supports(animation-timeline:view()){#trabalhos,#galeria,#sobre,#contato{animation:sheet linear both;animation-timeline:view();animation-range:entry 0% entry 55%}}

#contato{border-radius:var(--rd);gap:10px;padding:10px;background:#000}
#contato>div{border-radius:22px}
.cta{grid-column:1/-1;display:flex;justify-content:center;align-items:center;gap:16px;min-height:clamp(120px,16vw,240px);border-radius:26px;background:var(--cta);background-size:200% 100%;color:#111;text-decoration:none;font:800 clamp(28px,4.6vw,70px) var(--s);letter-spacing:-.045em;transition:background-position .8s var(--ease),scale .5s var(--ease)}
.cta:hover{background-position:100% 0;scale:.992}.cta i{font-style:normal;transition:translate .5s var(--ease)}.cta:hover i{translate:14px 0}

#contato{grid-template-columns:repeat(3,1fr)}@media(max-width:800px){#contato{grid-template-columns:1fr}}
.sm .chip{background:#000;color:#fff}

/* ===== Tipografia: Futura nos textos, DM Sans (títulos) ===== */
:root{--h:'DM Sans','Helvetica Neue',Arial,sans-serif;--m:'Futura','Jost','Futura PT','Century Gothic','Trebuchet MS',sans-serif;--s:'Futura','Jost','Futura PT','Century Gothic','Trebuchet MS',sans-serif}
.bh>span,.wide,.wide [data-p],.about h2,.nm b,.fld .t,.cta,.wm span,.sw strong,.sk strong,#contato h3,.hc{font-family:var(--h)!important}
.wide,.wide [data-p]{font-style:normal!important}
#contato h3{font-style:normal;font-weight:800;text-transform:uppercase;letter-spacing:-.03em;font-size:clamp(20px,2.2vw,30px);line-height:1}
/* espaçamentos: título -> conteúdo igual nos três blocos */
.bh{flex-wrap:nowrap;align-items:flex-end}.bh>span{font-size:clamp(34px,5.2vw,78px)}.bh>p{flex:0 1 300px}

.bh{margin-bottom:clamp(24px,3vw,40px)}
.blk{margin-top:clamp(72px,9vw,128px)}
.pastas{padding-top:0;padding-bottom:clamp(30px,5vw,64px)}

#galeria{padding:clamp(48px,6vw,80px) clamp(10px,1.6vw,22px) clamp(40px,5vw,70px)}
#galeria .wide{max-width:none;margin:0 clamp(4px,.8vw,12px) clamp(28px,3.4vw,48px)}

/* linha do tempo responsiva */
.tp{overflow-wrap:anywhere}.tp>div{font-size:clamp(9.5px,1.5cqw,12px)}
@container (max-width:780px){
  .tl{display:block;height:auto;border-left:1.5px solid currentColor;margin-left:5px}

.cx{border:1px solid color-mix(in srgb,currentColor 18%,transparent);border-radius:22px;background:color-mix(in srgb,currentColor 5%,transparent);margin:0 0 clamp(24px,3vw,40px);overflow:hidden}

.cr{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:baseline;padding:11px 18px;border-bottom:1px solid color-mix(in srgb,currentColor 9%,transparent);transition:background .3s}
.cr:last-child{border-bottom:0}.cr:hover{background:color-mix(in srgb,currentColor 8%,transparent)}
.cr em{font:600 12px var(--m);font-style:normal;opacity:.6}
.cr b{display:block;font:600 14px var(--m)}.cr u{text-decoration:none;font:400 12px var(--m);opacity:.65}
a[data-dl]::after{content:" \2193"}

/* cursos complementares: hierarquia baixa */
.cx{border:0;background:none;border-radius:0;margin:0 0 clamp(20px,2.6vw,34px);overflow:visible}
.cxb{padding:0 0 8px;border:0;gap:0}.cxb i{display:none}

.cr{display:flex;gap:8px;align-items:baseline;padding:3px 0;border:0;break-inside:avoid;opacity:.6;transition:opacity .3s}
.cr:hover{background:none;opacity:1}
.cr em{flex:0 0 34px;font:500 11px var(--m)}
.cr span{display:block}.cr b{display:inline;font:500 12px var(--m)}.cr u{display:inline;font:400 11px var(--m);margin-left:6px;opacity:.7}
@media(max-width:700px){.cxl{columns:1}}
/* títulos: exatamente a mesma tipografia, tamanho e cor */
.blk .bh>span{color:inherit!important;font-size:clamp(34px,5.2vw,78px)!important;font-weight:800!important;letter-spacing:-.045em!important;line-height:.9!important;text-transform:uppercase!important;font-style:normal!important;opacity:1!important;visibility:visible!important;display:block!important}
.blk .bh>span em{background:var(--cta);-webkit-background-clip:text;background-clip:text;color:transparent!important;font-style:normal}
#galeria .wide{display:flex;flex-wrap:wrap;gap:0 .26em;justify-content:flex-start;font-size:clamp(34px,5.2vw,78px)!important;font-weight:800;letter-spacing:-.045em;line-height:.9;text-transform:uppercase;color:inherit}
#galeria .wide>*{font:inherit!important;letter-spacing:inherit!important;color:inherit!important;font-style:normal!important;text-transform:inherit!important;font-family:var(--h)!important}
#galeria .wide>:last-child{background:var(--cta);-webkit-background-clip:text;background-clip:text;color:transparent!important}

/* linha do tempo: foto ao passar o mouse na bolinha */
.tp::before{display:none!important}
.tdot{position:absolute;left:0;top:calc(var(--tlh)/2 - 4px);width:8px;height:8px;cursor:pointer;z-index:5;outline:none;--dc:var(--p1)}
.tp:nth-child(4n+2) .tdot{--dc:var(--p2)}.tp:nth-child(4n+3) .tdot{--dc:var(--p4)}.tp:nth-child(4n) .tdot{--dc:#6B8BFF}
.tdot::before{content:"";position:absolute;inset:0;border-radius:50%;background:var(--dc);transition:scale .4s var(--ease)}
.tdot::after{content:"";position:absolute;inset:-10px;border-radius:50%}
.tdot:hover::before,.tdot:focus::before{scale:1.9}
.tp:hover,.tp:focus-within{z-index:30}
.tph{position:absolute;left:50%;width:clamp(150px,15vw,200px);padding:14px 0;opacity:0;pointer-events:none;translate:-50% var(--ty,8px);scale:.7;transition:opacity .35s var(--ease),translate .5s var(--ease),scale .5s var(--ease);z-index:2}
.tp.dn .tph{bottom:100%}.tp.up .tph{top:100%;--ty:-8px}
.tp:first-child .tph{left:-4px;translate:0 var(--ty,8px)}
.tp:last-child .tph{left:auto;right:-4px;translate:0 var(--ty,8px)}
.tdot:hover .tph,.tdot:focus .tph{opacity:1;pointer-events:auto;scale:1;translate:-50% 0}
.tp:first-child .tdot:hover .tph,.tp:first-child .tdot:focus .tph,.tp:last-child .tdot:hover .tph,.tp:last-child .tdot:focus .tph{translate:0 0}
.tph .slot{width:100%;border-radius:16px;border:4px solid #fff;box-shadow:0 18px 50px rgba(0,0,0,.5);rotate:-3deg;background:var(--vazio)}
.tp:nth-child(even) .tph .slot{rotate:3deg}
body:not(.ed) .tph.empty{display:none}
@container (max-width:780px){
  .tdot{left:-6px;top:.4em}
  .tp .tph,.tp:first-child .tph,.tp:last-child .tph{left:18px;right:auto;top:-14px;bottom:auto;--ty:0px;translate:0 0;scale:.8}
  .tdot:hover .tph,.tdot:focus .tph,.tp:first-child .tdot:hover .tph,.tp:first-child .tdot:focus .tph,.tp:last-child .tdot:hover .tph,.tp:last-child .tdot:focus .tph{translate:0 0;scale:1}
}

/* Identidade Visual: colunas = quantidade de janelas (2 janelas ocupam toda a largura, centralizadas) */
.pastas{grid-template-columns:repeat(var(--np,3),1fr)}
@media(max-width:700px){.pastas{grid-template-columns:1fr}}
</style></head>

  Object.keys(c.camadas||{}).forEach(function(id){var m=c.camadas[id],e;try{e=$(m.s)}catch(x){}if(!e||!(m.t||m.d||m.du))return;e.setAttribute('data-rv',m.d||0);if(m.du)e.style.setProperty('--du',m.du+'s');if(m.t)e.classList.add('rv-'+m.t)});
  camGeo();
  $$('.pastas').forEach(function(pw){pw.style.setProperty('--np',Math.max(1,pw.querySelectorAll(':scope>.fld').length))});
  $$('.nm b').forEach(function(b){var m=(b.textContent||'').trim().match(/^(\d+)(.*)$/);if(!m||Site.editing||reduce)return;b.textContent='0'+m[2];var o=new IntersectionObserver(function(es){if(!es[0].isIntersecting)return;o.disconnect();var t0=performance.now();(function f(t){var k=Math.min(1,(t-t0)/1400),e=1-Math.pow(1-k,4);b.textContent=Math.round(+m[1]*e)+m[2];if(k<1)requestAnimationFrame(f)})(t0)},{threshold:.6});o.observe(b)});
  var rvs=$$('[data-rv]');
  rvs.forEach(function(e){e.classList.add('rv');e.style.setProperty('--d',(parseFloat(e.getAttribute('data-rv'))||0)+'s')});
  if(io){io.disconnect();io=null}
  var inst=opts.instant||Site.editing||!M.revelarAoRolar||reduce||!('IntersectionObserver' in window);

  if(inst)rvs.forEach(function(e){e.classList.add('in')});
  else{io=new IntersectionObserver(function(es){es.forEach(function(x){if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}})},{threshold:.1,rootMargin:'0px 0px -5% 0px'});rvs.forEach(function(e){io.observe(e)})}

  $$('.drag').forEach(function(el){

/* ---------- movimento ---------- */
var vh=window.innerHeight,started=false,first=true;
function measure(){vh=window.innerHeight;mqs.forEach(function(m,i){if(mqIn[i])m._half=mqIn[i].scrollWidth/2})}
window.addEventListener('resize',measure);window.addEventListener('load',measure);

var px=0,py=0,tx2=0,ty2=0;
window.addEventListener('pointermove',function(e){
  var M=Site.C.movimento;if(!M.blobSegueMouse||reduce)return;
  tx2=(e.clientX/window.innerWidth-.5)*2*M.alcanceBlob;ty2=(e.clientY/window.innerHeight-.5)*2*M.alcanceBlob;
},{passive:true});

var last=performance.now(),prevY=window.scrollY,sv=0,pg=0,navY=window.scrollY;
function clamp(v,a,b){return Math.min(b,Math.max(a,v))}
function frame(now){
  var M=Site.C.movimento,dt=Math.min(.05,(now-last)/1000)||.016;last=now;
  var y=window.scrollY,a=reduce?1:1-Math.exp(-dt*7),max=R.scrollHeight-window.innerHeight;
  pg+=((max>0?y/max:0)-pg)*(first?1:a);if(bar)bar.style.transform='scaleX('+pg.toFixed(4)+')';
  sv+=((y-prevY)/dt-sv)*(1-Math.exp(-dt*6));prevY=y;

  if(!reduce){
    mqs.forEach(function(m,i){
      var v=(m._sp+Math.min(Math.abs(sv)*M.faixasReagemAoRolar,900))*m._dir,h=m._half;
      m._x-=v*dt;
      if(h){while(m._x<=-h)m._x+=h;while(m._x>0)m._x-=h}
      if(mqIn[i])mqIn[i].style.transform='translate3d('+m._x.toFixed(1)+'px,0,0)';
    });
    var on=M.parallax&&!Site.editing&&window.innerWidth>860;
    $$('[data-par]').forEach(function(e){
      var sec=e.closest('section'),r=sec.getBoundingClientRect(),tgt=0;
      if(r.bottom<-300||r.top>vh+300)return;
      if(on)tgt=(r.top+r.height/2-vh/2)*parseFloat(e.getAttribute('data-par'))*M.forcaParallax;
      e._p=(e._p==null||first)?tgt:e._p+(tgt-e._p)*a;
      e.style.transform='translate3d(0,'+e._p.toFixed(2)+'px,0)';
    });
    if(blob){px+=(tx2-px)*a;py+=(ty2-py)*a;blob.style.translate=px.toFixed(2)+'px '+py.toFixed(2)+'px'}
    posters.forEach(function(p){
      var r=p.el.getBoundingClientRect(),t=clamp((vh-r.top)/(vh+r.height),0,1),tgt=p.a0+t*(p.a1-p.a0);
      p._v=(p._v==null||first)?tgt:p._v+(tgt-p._v)*a;
      p.el.style.setProperty('--ry',p._v.toFixed(2)+'deg');
    });
    if(M.esconderMenuAoRolar&&!Site.editing&&nav){
      var d=y-navY;
      if(Math.abs(d)>6){nav.classList.toggle('off',d>0&&y>160);navY=y}
    }else if(nav&&nav.classList.contains('off'))nav.classList.remove('off');
  }else{
    posters.forEach(function(p){p.el.style.setProperty('--ry',((p.a0+p.a1)/2)+'deg')});
  }
  first=false;
  requestAnimationFrame(frame);
}

function dlPdf(){
